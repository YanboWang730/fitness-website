<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chest Workout | Fitness Guide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="site-header">
        <div class="container">
            <a href="index.html">Home</a>
            <a href="chest.html" class="active">Chest</a>
            <a href="back.html">Back</a>
            <a href="leg.html">Leg</a>
        </div>
    </nav>

    <main class="container">
        <h1>胸部训练 Chest Workout</h1>
        <p>All chest exercises, equipment and target muscle area.</p>

        <!-- 动作1 平板杠铃卧推 -->
        <section class="exercise-card">
            <h2>平板杠铃卧推</h2>
            <p><strong>器械：</strong>杠铃、平板卧推凳</p>
            <p><strong>目标肌群：</strong>全胸（整体胸大肌）</p>
            <img src="" alt="平板杠铃卧推，全胸肌肉标红示意图" class="exercise-img">
        </section>

        <!-- 动作2 上斜杠铃卧推 -->
        <section class="exercise-card">
            <h2>上斜杠铃卧推</h2>
            <p><strong>器械：</strong>杠铃、上斜卧推凳</p>
            <p><strong>目标肌群：</strong>上胸</p>
            <img src="" alt="上斜杠铃卧推，上胸肌肉标红示意图" class="exercise-img">
        </section>

        <!-- 动作3 低位龙门架绳索夹胸 -->
        <section class="exercise-card">
            <h2>低位龙门架绳索夹胸</h2>
            <p><strong>器械：</strong>龙门架、绳索把手</p>
            <p><strong>目标肌群：</strong>胸外沿、下胸</p>
            <img src="" alt="低位龙门架绳索夹胸，胸外沿标红示意图" class="exercise-img">
        </section>

        <!-- 动作4 平板哑铃飞鸟 -->
        <section class="exercise-card">
            <h2>平板哑铃飞鸟</h2>
            <p><strong>器械：</strong>哑铃、平板凳</p>
            <p><strong>目标肌群：</strong>胸肌中缝</p>
            <img src="" alt="平板哑铃飞鸟，胸肌中缝标红示意图" class="exercise-img">
        </section>

        <!-- 动作5 坐姿器械推胸 -->
        <section class="exercise-card">
            <h2>坐姿器械推胸</h2>
            <p><strong>器械：</strong>坐姿推胸器械</p>
            <p><strong>目标肌群：</strong>中胸</p>
            <img src="" alt="坐姿器械推胸，中胸标红示意图" class="exercise-img">
        </section>

        <!-- 动作6 双杠臂屈伸 -->
        <section class="exercise-card">
            <h2>双杠臂屈伸（侧重胸部）</h2>
            <p><strong>器械：</strong>双杠</p>
            <p><strong>目标肌群：</strong>下胸、胸外侧</p>
            <img src="" alt="双杠臂屈伸，下胸标红示意图" class="exercise-img">
        </section>

    </main>
</body>
</html>
