<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肌群选择 | Muscle Select</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #222222;
            --header-bg: #ff6b35;
            --header-text: #ffffff;
            --nav-bg: #ffffff;
            --card-bg: #ffffff;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #eeeeee;
            --header-bg: #d35400;
            --header-text: #ffffff;
            --nav-bg: #1e1e1e;
            --card-bg: #1e1e1e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }
        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        header h1 {
            font-size: 1.4rem;
        }
        .header-btns {
            display: flex;
            gap: 10px;
        }
        .theme-toggle {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.4);
            color: white;
            border-radius: 20px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 16px;
        }
        .theme-toggle:hover {
            border-color: white;
        }
        .top-nav {
            background: var(--nav-bg);
            padding: 0.7rem;
            text-align: center;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem 1.5rem;
            border-bottom: 1px solid rgba(128,128,128,0.2);
        }
        .top-nav a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .top-nav a:hover {
            color: #ff6b35;
        }
        [data-lang="en"] .zh { display: none; }
        [data-lang="zh"] .en { display: none; }
        .container {
            width: 100%;
            height: calc(100vh - 130px);
            position: relative;
        }
        #canvas-wrap {
            width: 100%;
            height: 100%;
        }
        .tip {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        [data-theme="dark"] .tip {
            background: rgba(255,255,255,0.15);
        }
        @media (max-width: 768px) {
            header h1 { font-size: 1.1rem; }
            .tip { font-size: 0.75rem; padding: 6px 12px; }
        }
    </style>
</head>
<body>
    <header>
        <h1><span class="zh">肌群选择</span> <small class="en">Muscle Select</small></h1>
        <div class="header-btns">
            <button class="theme-toggle" onclick="toggleLang()" id="langBtn">EN</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>
    </header>
    <nav class="top-nav">
        <a href="index.html">🏠 <span class="zh">首页</span> <span class="en en-text">Home</span></a>
        <a href="chest.html">💪 <span class="zh">动作详解</span> <span class="en en-text">Exercise Details</span></a>
        <a href="muscle-select.html">💪 <span class="zh">肌群选择</span> <span class="en en-text">Muscle Select</span></a>
        <a href="about.html">ℹ️ <span class="zh">关于</span> <span class="en en-text">About</span></a>
    </nav>
    <div class="container">
        <div id="canvas-wrap"></div>
        <div class="tip">
            <span class="zh">🖱️ 拖拽旋转 · 滚轮缩放 · 点击橙色胸肌进入胸部训练</span>
            <span class="en">🖱️ Drag to rotate · Scroll to zoom · Click orange chest for chest training</span>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script>
        // ========== 主题 & 语言 全局逻辑 ==========
        const html = document.documentElement;

        function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                html.setAttribute('data-theme', 'dark');
                document.getElementById('themeBtn').textContent = '☀️';
            } else {
                html.removeAttribute('data-theme');
                document.getElementById('themeBtn').textContent = '🌙';
            }
        }
        function toggleTheme() {
            const isDark = html.getAttribute('data-theme') === 'dark';
            if (isDark) {
                html.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                document.getElementById('themeBtn').textContent = '🌙';
            } else {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                document.getElementById('themeBtn').textContent = '☀️';
            }
        }
        function initLang() {
            const saved = localStorage.getItem('lang');
            if (saved === 'en') {
                html.setAttribute('data-lang', 'en');
                document.getElementById('langBtn').textContent = '中';
            } else {
                html.setAttribute('data-lang', 'zh');
                document.getElementById('langBtn').textContent = 'EN';
            }
        }
        function toggleLang() {
            const current = html.getAttribute('data-lang');
            const next = current === 'en' ? 'zh' : 'en';
            html.setAttribute('data-lang', next);
            localStorage.setItem('lang', next);
            document.getElementById('langBtn').textContent = next === 'en' ? '中' : 'EN';
        }
        initTheme();
        initLang();
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ========== Three.js 3D线框人体模型 ==========
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee);

        const container = document.getElementById('canvas-wrap');
        const w = container.clientWidth;
        const h = container.clientHeight;

        const camera = new THREE.PerspectiveCamera(50, w / h, 0.1, 100);
        camera.position.set(0, 0, 9);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 5;
        controls.maxDistance = 20;

        // 线框材质（蓝色，身体）
        const bodyMat = new THREE.MeshBasicMaterial({
            color: 0x4488dd,
            wireframe: true
        });
        // 胸肌材质（橙色，可点击）
        const chestMat = new THREE.MeshBasicMaterial({
            color: 0xff6b35,
            wireframe: true
        });

        // 躯干
        const torsoGeo = new THREE.BoxGeometry(2.0, 2.8, 1.0);
        const torso = new THREE.Mesh(torsoGeo, bodyMat);
        torso.position.y = 0.8;
        scene.add(torso);

        // 胸肌（可点击区域，橙色高亮）
        const chestGeo = new THREE.BoxGeometry(1.6, 1.2, 0.3);
        const chestMesh = new THREE.Mesh(chestGeo, chestMat);
        chestMesh.position.set(0, 1.1, 0.55);
        chestMesh.userData.link = "chest.html";
        scene.add(chestMesh);

        // 左上臂
        const armGeo = new THREE.BoxGeometry(0.6, 2.2, 0.6);
        const leftArm = new THREE.Mesh(armGeo, bodyMat);
        leftArm.position.set(-1.3, 1.2, 0);
        scene.add(leftArm);
        // 右上臂
        const rightArm = new THREE.Mesh(armGeo, bodyMat);
        rightArm.position.set(1.3, 1.2, 0);
        scene.add(rightArm);

        // 左前臂
        const foreArmGeo = new THREE.BoxGeometry(0.5, 1.8, 0.5);
        const leftForeArm = new THREE.Mesh(foreArmGeo, bodyMat);
        leftForeArm.position.set(-1.3, -1.2, 0);
        scene.add(leftForeArm);
        // 右前臂
        const rightForeArm = new THREE.Mesh(foreArmGeo, bodyMat);
        rightForeArm.position.set(1.3, -1.2, 0);
        scene.add(rightForeArm);

        // 左大腿
        const legGeo = new THREE.BoxGeometry(0.7, 2.8, 0.7);
        const leftLeg = new THREE.Mesh(legGeo, bodyMat);
        leftLeg.position.set(-0.6, -2.0, 0);
        scene.add(leftLeg);
        // 右大腿
        const rightLeg = new THREE.Mesh(legGeo, bodyMat);
        rightLeg.position.set(0.6, -2.0, 0);
        scene.add(rightLeg);

        // 头部（简单球体线框）
        const headGeo = new THREE.SphereGeometry(0.5, 12, 10);
        const head = new THREE.Mesh(headGeo, bodyMat);
        head.position.y = 2.8;
        scene.add(head);

        // 点击检测
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        renderer.domElement.addEventListener('click', (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects([chestMesh]);
            if (intersects.length > 0) {
                window.location.href = intersects[0].object.userData.link;
            }
        });

        // 悬停效果（鼠标变手型）
        renderer.domElement.addEventListener('mousemove', (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects([chestMesh]);
            renderer.domElement.style.cursor = intersects.length > 0 ? 'pointer' : 'grab';
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const w2 = container.clientWidth;
            const h2 = container.clientHeight;
            camera.aspect = w2 / h2;
            camera.updateProjectionMatrix();
            renderer.setSize(w2, h2);
        });
    </script>
</body>
</html>
