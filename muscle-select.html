<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肌群选择 | Muscle Select</title>
    <style>
        :root{
            --bg: #f4f4f4;
            --card-bg: #ffffff;
            --text: #222222;
            --text-muted: #777777;
            --header-bg: #222222;
            --header-text: #ffffff;
            --nav-bg: #333333;
            --nav-text: #ffffff;
            --accent: #ff6b35;
            --accent-hover: #e65a28;
            --hover-bg: #eeeeee;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        [data-theme="dark"]{
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --text-muted: #aaaaaa;
            --header-bg: #1a1a1a;
            --header-text: #e0e0e0;
            --nav-bg: #2a2a2a;
            --nav-text: #e0e0e0;
            --accent: #ff8c3f;
            --accent-hover: #ff6b35;
            --hover-bg: #2a2a2a;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            transition: background-color 0.3s, color 0.3s;
        }
        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 1rem;
            text-align: center;
            position: relative;
        }
        header h1 {
            font-size: 1.5rem;
        }
        header h1 small {
            font-size: 1rem;
            font-weight: normal;
            opacity: 0.75;
            display:block;
        }
        .header-btns {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 10px;
        }
        .theme-toggle {
            background: transparent;
            border: 2px solid #666;
            color: var(--header-text);
            border-radius: 20px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 16px;
        }
        .theme-toggle:hover {
            border-color: var(--accent);
        }
        /* 语言模式 */
        html:not([data-lang="en"]) .en {
            display: none;
        }
        html[data-lang="en"] .zh {
            display: none;
        }
        html[data-lang="en"] .en-text {
            font-size: 1.1rem;
            opacity: 1;
        }
        html[data-lang="en"] header h1 small {
            font-size: 1.1rem;
            opacity: 0.75;
        }
        .top-nav{
            background: var(--nav-bg);
            padding:0.7rem;
            text-align:center;
            display:flex;
            justify-content:center;
            flex-wrap:wrap;
            gap:20px;
        }
        .top-nav a{
            color: var(--nav-text);
            text-decoration:none;
            display:inline-block;
        }
        .top-nav a:hover{
            color: var(--accent);
        }
        .en-text {
            font-size: 1rem;
            opacity: 0.65;
            display:block;
            margin-top:2px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }
        .image-wrap {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .image-wrap img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
        }
        /* 热区样式 */
        .hotspot {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hotspot:hover {
            background: rgba(255, 107, 53, 0.4);
            transform: scale(1.1);
        }
        .hotspot .label {
            position: absolute;
            white-space: nowrap;
            background: var(--card-bg);
            color: var(--text);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            box-shadow: var(--card-shadow);
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .hotspot:hover .label {
            opacity: 1;
        }
        /* 各个热区位置（按百分比定位） */
        .hs-chest { top: 32%; left: 50%; width: 80px; height: 50px; transform: translateX(-50%); }
        .hs-chest .label { bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 8px; }
        .hs-back { top: 30%; left: 50%; width: 80px; height: 60px; transform: translateX(-50%); }
        .hs-back .label { bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 8px; }
        .hs-shoulder { top: 26%; left: 22%; width: 45px; height: 45px; }
        .hs-shoulder .label { top: 50%; right: 100%; transform: translateY(-50%); margin-right: 8px; }
        .hs-arm { top: 38%; left: 12%; width: 40px; height: 70px; }
        .hs-arm .label { top: 50%; right: 100%; transform: translateY(-50%); margin-right: 8px; }
        .hs-leg { top: 60%; left: 35%; width: 45px; height: 90px; }
        .hs-leg .label { top: 100%; left: 50%; transform: translateX(-50%); margin-top: 8px; }
        .hs-core { top: 48%; left: 50%; width: 50px; height: 60px; transform: translateX(-50%); }
        .hs-core .label { bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 8px; }

        .view-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .view-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            background: var(--card-bg);
            color: var(--text);
            box-shadow: var(--card-shadow);
        }
        .view-btn.active {
            background: var(--accent);
            color: white;
        }
        .tip {
            text-align: center;
            margin-top: 16px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        @media (max-width: 768px) {
            header h1 { font-size: 1.2rem; }
            .header-btns { right: 10px; gap: 6px; }
            .container { padding: 10px; }
            .hotspot .label { font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1><span class="zh">健身训练指南</span> <small class="en">Fitness Training Guide</small></h1>
        <div class="header-btns">
            <button class="theme-toggle" onclick="toggleLang()" id="langBtn">EN</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>
    </header>
    <nav class="top-nav">
        <a href="index.html">🏠 <span class="zh">首页</span> <span class="en en-text">Home</span></a>
        <a href="chest.html">🏋️ <span class="zh">动作详解</span> <span class="en en-text">Exercise Details</span></a>
        <a href="muscle-select.html">💪 <span class="zh">肌群选择</span> <span class="en en-text">Muscle Select</span></a>
        <a href="about.html">ℹ️ <span class="zh">关于</span> <span class="en en-text">About</span></a>
    </nav>

    <div class="container">
        <div class="view-toggle">
            <button class="view-btn active" id="btnAnterior" onclick="switchView('anterior')">
                <span class="zh">正面</span><span class="en">Front</span>
            </button>
            <button class="view-btn" id="btnPosterior" onclick="switchView('posterior')">
                <span class="zh">背面</span><span class="en">Back</span>
            </button>
        </div>

        <div class="image-wrap">
            <img id="muscleImg" src="images/muscle-anterior.jpg" alt="Muscle Anatomy">

            <!-- 正面热区 -->
            <div class="hotspot hs-chest" onclick="location.href='chest.html'">
                <span class="label"><span class="zh">胸部</span> <span class="en">Chest</span></span>
            </div>
            <div class="hotspot hs-shoulder" onclick="location.href='shoulder.html'">
                <span class="label"><span class="zh">肩部</span> <span class="en">Shoulder</span></span>
            </div>
            <div class="hotspot hs-arm" onclick="location.href='arms.html'">
                <span class="label"><span class="zh">手臂</span> <span class="en">Arms</span></span>
            </div>
            <div class="hotspot hs-core" onclick="location.href='core.html'">
                <span class="label"><span class="zh">核心</span> <span class="en">Core</span></span>
            </div>
            <div class="hotspot hs-leg" onclick="location.href='legs.html'">
                <span class="label"><span class="zh">腿部</span> <span class="en">Legs</span></span>
            </div>
            <div class="hotspot hs-back" onclick="location.href='back.html'" style="display:none">
                <span class="label"><span class="zh">背部</span> <span class="en">Back</span></span>
            </div>
        </div>

        <div class="tip">
            <span class="zh">🖱️ 点击高亮的肌肉区域进入对应训练动作页面</span>
            <span class="en">🖱️ Click on a muscle group to view its exercises</span>
        </div>
    </div>

    <script>
        // ========== 主题 & 语言 全局逻辑 ==========
        const html = document.documentElement;

        function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                html.setAttribute('data-theme', 'dark');
                document.getElementById('themeBtn').textContent = '☀️';
            } else {
                html.removeAttribute('data-theme');
                document.getElementById('themeBtn').textContent = '🌙';
            }
        }
        function toggleTheme() {
            const isDark = html.getAttribute('data-theme') === 'dark';
            if (isDark) {
                html.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                document.getElementById('themeBtn').textContent = '🌙';
            } else {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                document.getElementById('themeBtn').textContent = '☀️';
            }
        }
        function initLang() {
            const saved = localStorage.getItem('lang');
            if (saved === 'en') {
                html.setAttribute('data-lang', 'en');
                document.getElementById('langBtn').textContent = '中';
            } else {
                html.setAttribute('data-lang', 'zh');
                document.getElementById('langBtn').textContent = 'EN';
            }
        }
        function toggleLang() {
            const current = html.getAttribute('data-lang');
            const next = current === 'en' ? 'zh' : 'en';
            html.setAttribute('data-lang', next);
            localStorage.setItem('lang', next);
            document.getElementById('langBtn').textContent = next === 'en' ? '中' : 'EN';
        }
        initTheme();
        initLang();

        // 正面/背面切换
        function switchView(view) {
            const btnA = document.getElementById('btnAnterior');
            const btnP = document.getElementById('btnPosterior');
            const img = document.getElementById('muscleImg');
            if (view === 'anterior') {
                btnA.classList.add('active');
                btnP.classList.remove('active');
                img.src = 'images/muscle-anterior.jpg';
                // 正面显示胸、肩、手臂、核心、腿
                document.querySelector('.hs-chest').style.display = 'flex';
                document.querySelector('.hs-shoulder').style.display = 'flex';
                document.querySelector('.hs-arm').style.display = 'flex';
                document.querySelector('.hs-core').style.display = 'flex';
                document.querySelector('.hs-leg').style.display = 'flex';
                document.querySelector('.hs-back').style.display = 'none';
            } else {
                btnP.classList.add('active');
                btnA.classList.remove('active');
                // 背面暂时用同一张图镜像，后面可以换真正的背面图
                img.src = 'images/muscle-anterior.jpg';
                img.style.transform = 'scaleX(-1)';
                // 背面显示背、肩、手臂、腿
                document.querySelector('.hs-chest').style.display = 'none';
                document.querySelector('.hs-shoulder').style.display = 'flex';
                document.querySelector('.hs-arm').style.display = 'flex';
                document.querySelector('.hs-core').style.display = 'none';
                document.querySelector('.hs-leg').style.display = 'flex';
                document.querySelector('.hs-back').style.display = 'flex';
            }
        }
    </script>
</body>
</html>
