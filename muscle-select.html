<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肌群选择 | Muscle Select</title>
    <style>
        :root{
            --bg: #f4f4f4;
            --card-bg: #ffffff;
            --text: #222222;
            --text-muted: #777777;
            --header-bg: #222222;
            --header-text: #ffffff;
            --nav-bg: #333333;
            --nav-text: #ffffff;
            --accent: #ff6b35;
            --accent-hover: #e65a28;
            --hover-bg: #eeeeee;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        [data-theme="dark"]{
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --text-muted: #aaaaaa;
            --header-bg: #1a1a1a;
            --header-text: #e0e0e0;
            --nav-bg: #2a2a2a;
            --nav-text: #e0e0e0;
            --accent: #ff8c3f;
            --accent-hover: #ff6b35;
            --hover-bg: #2a2a2a;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            transition: background-color 0.3s, color 0.3s;
        }
        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 1rem;
            text-align: center;
            position: relative;
        }
        header h1 {
            font-size: 1.5rem;
        }
        header h1 small {
            font-size: 1rem;
            font-weight: normal;
            opacity: 0.75;
            display:block;
        }
        .header-btns {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 10px;
        }
        .theme-toggle {
            background: transparent;
            border: 2px solid #666;
            color: var(--header-text);
            border-radius: 20px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 16px;
        }
        .theme-toggle:hover {
            border-color: var(--accent);
        }
        /* 语言模式 */
        html:not([data-lang="en"]) .en {
            display: none;
        }
        html[data-lang="en"] .zh {
            display: none;
        }
        html[data-lang="en"] .en-text {
            font-size: 1.1rem;
            opacity: 1;
        }
        html[data-lang="en"] header h1 small {
            font-size: 1.1rem;
            opacity: 0.75;
        }
        .top-nav{
            background: var(--nav-bg);
            padding:0.7rem;
            text-align:center;
            display:flex;
            justify-content:center;
            flex-wrap:wrap;
            gap:20px;
        }
        .top-nav a{
            color: var(--nav-text);
            text-decoration:none;
            display:inline-block;
        }
        .top-nav a:hover{
            color: var(--accent);
        }
        .en-text {
            font-size: 1rem;
            opacity: 0.65;
            display:block;
            margin-top:2px;
        }
        .container {
            width: 100%;
            height: calc(100vh - 112px);
            position: relative;
        }
        #canvas-wrap {
            width: 100%;
            height: 100%;
        }
        .tip {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card-bg);
            color: var(--text);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            white-space: nowrap;
            box-shadow: var(--card-shadow);
        }
        @media (max-width: 768px) {
            header h1 { font-size: 1.2rem; }
            .header-btns { right: 10px; gap: 6px; }
            .tip { font-size: 0.75rem; padding: 6px 12px; }
        }
    </style>
</head>
<body>
    <header>
        <h1><span class="zh">健身训练指南</span> <small class="en">Fitness Training Guide</small></h1>
        <div class="header-btns">
            <button class="theme-toggle" onclick="toggleLang()" id="langBtn">EN</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>
    </header>
    <nav class="top-nav">
        <a href="index.html">🏠 <span class="zh">首页</span> <span class="en en-text">Home</span></a>
        <a href="chest.html">🏋️ <span class="zh">动作详解</span> <span class="en en-text">Exercise Details</span></a>
        <a href="muscle-select.html">💪 <span class="zh">肌群选择</span> <span class="en en-text">Muscle Select</span></a>
        <a href="about.html">ℹ️ <span class="zh">关于</span> <span class="en en-text">About</span></a>
    </nav>
    <div class="container">
        <div id="canvas-wrap"></div>
        <div class="tip">
            <span class="zh">🖱️ 拖拽旋转 · 滚轮缩放 · 点击橙色胸肌进入胸部训练</span>
            <span class="en">🖱️ Drag to rotate · Scroll to zoom · Click orange chest for chest training</span>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script>
        // ========== 主题 & 语言 全局逻辑 ==========
        const html = document.documentElement;

        function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                html.setAttribute('data-theme', 'dark');
                document.getElementById('themeBtn').textContent = '☀️';
            } else {
                html.removeAttribute('data-theme');
                document.getElementById('themeBtn').textContent = '🌙';
            }
        }
        function toggleTheme() {
            const isDark = html.getAttribute('data-theme') === 'dark';
            if (isDark) {
                html.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                document.getElementById('themeBtn').textContent = '🌙';
            } else {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                document.getElementById('themeBtn').textContent = '☀️';
            }
        }
        function initLang() {
            const saved = localStorage.getItem('lang');
            if (saved === 'en') {
                html.setAttribute('data-lang', 'en');
                document.getElementById('langBtn').textContent = '中';
            } else {
                html.setAttribute('data-lang', 'zh');
                document.getElementById('langBtn').textContent = 'EN';
            }
        }
        function toggleLang() {
            const current = html.getAttribute('data-lang');
            const next = current === 'en' ? 'zh' : 'en';
            html.setAttribute('data-lang', next);
            localStorage.setItem('lang', next);
            document.getElementById('langBtn').textContent = next === 'en' ? '中' : 'EN';
        }
        initTheme();
        initLang();
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // ========== Three.js 3D 人体模型 ==========
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);

        const container = document.getElementById('canvas-wrap');
        const w = container.clientWidth;
        const h = container.clientHeight;

        const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
        camera.position.set(0, 1.2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 2;
        controls.maxDistance = 10;
        controls.target.set(0, 1, 0);

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(3, 5, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);
        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight2.position.set(-3, 3, -3);
        scene.add(dirLight2);

        // 胸肌点击热区（橙色半透明球体）
        const chestGeo = new THREE.SphereGeometry(0.35, 16, 12);
        const chestMat = new THREE.MeshBasicMaterial({
            color: 0xff6b35,
            transparent: true,
            opacity: 0.5
        });
        const chestMesh = new THREE.Mesh(chestGeo, chestMat);
        chestMesh.position.set(0, 1.35, 0.25);
        chestMesh.userData.link = "chest.html";
        scene.add(chestMesh);

        // 加载人体模型
        const loader = new GLTFLoader();
        loader.load(
            'https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/examples/models/gltf/Xbot.glb',
            function (gltf) {
                const model = gltf.scene;
                model.scale.set(0.015, 0.015, 0.015);
                model.position.set(0, 0, 0);
                scene.add(model);
            },
            undefined,
            function (error) {
                console.error('模型加载失败', error);
                // 加载失败的话，用简单的胶囊体代替
                const bodyGeo = new THREE.CapsuleGeometry(0.3, 1.2, 8, 16);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 1;
                scene.add(body);
            }
        );

        // 点击检测
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        renderer.domElement.addEventListener('click', (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects([chestMesh]);
            if (intersects.length > 0) {
                window.location.href = intersects[0].object.userData.link;
            }
        });

        // 悬停效果
        renderer.domElement.addEventListener('mousemove', (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects([chestMesh]);
            renderer.domElement.style.cursor = intersects.length > 0 ? 'pointer' : 'grab';
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const w2 = container.clientWidth;
            const h2 = container.clientHeight;
            camera.aspect = w2 / h2;
            camera.updateProjectionMatrix();
            renderer.setSize(w2, h2);
        });
    </script>
</body>
</html>
